pool: default

trigger: none

stages:

- stage: build
  displayName: Node.js installation
  dependsOn: []
  jobs: 
  - job: nodejsInstall
    displayName: Node.js installation
    steps: 
    - task: UseNode@1
      inputs:
        versionSource: 'spec'
        version: '22.x'
    - task: Npm@1
      displayName: npm install
      inputs:
        command: 'install'
        workingDir: '$(Build.SourcesDirectory)'

    - task: Bash@3
      displayName: Build
      inputs:
        targetType: 'inline'
        script: 
          cd $(Build.SourcesDirectory)
          npm run build

    - task: Bash@3
      displayName: Check dist folder
      inputs:
        targetType: inline
        script: |
          echo "Build directory:"
          pwd
          echo "Source directory:"
          echo "$(Build.SourcesDirectory)"
          echo "Contents of source directory:"
          ls -la "$(Build.SourcesDirectory)"
          echo "Contents of dist:"
          ls -la "$(Build.SourcesDirectory)/dist"


- stage: nginxInstall
  displayName: Nginx Installation
  dependsOn: build
  jobs: 
  - job: nginxInstall
    displayName: Nginx installation
    steps: 
    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: |
          sudo apt update
          sudo apt install -y nginx

