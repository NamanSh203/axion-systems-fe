pool: default

trigger: none

stages:

- stage: build
  displayName: Build Frontend
  dependsOn: []
  jobs: 
  - job: buildFrontend
    displayName: Build Frontend
    steps: 
    - task: UseNode@1
      displayName: Node installation
      inputs:
        versionSource: 'spec'
        version: '22.x'
  
    - task: Npm@1
      displayName: npm install
      inputs:
        command: 'install'
        workingDir: '$(Build.SourcesDirectory)'

    - task: Bash@3
      displayName: Build
      inputs:
        targetType: 'inline'
        script: |
          cd '$(Build.SourcesDirectory)'
          npm run build


- stage: nginxInstall
  displayName: Nginx Installation
  dependsOn: build
  jobs: 
  - job: nginxInstall
    displayName: Nginx installation
    steps: 
    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: |
          sudo apt update
          sudo apt install -y nginx

